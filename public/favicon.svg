<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="dropGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0088cc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#003366" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#e0ffff"/>
      <stop offset="25%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#002840"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for crisp dark theme contrast -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  
  <!-- Outer subtle orbital ring -->
  <circle cx="32" cy="32" r="27" stroke="url(#ringGrad)" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="32" cy="32" r="22" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.25"/>
  
  <!-- Ambient glow behind drop -->
  <circle cx="32" cy="36" r="16" fill="url(#dropGlow)"/>

  <!-- Precision Water Drop Silhouette -->
  <path d="M32 14 C32 14 18 31 18 39.5 C18 47.23 24.27 53.5 32 53.5 C39.73 53.5 46 47.23 46 39.5 C46 31 32 14 32 14 Z" 
        fill="url(#dropGrad)" 
        filter="url(#glow)"/>
  
  <!-- Inner specular liquid highlights -->
  <ellipse cx="26" cy="36" rx="2.8" ry="6.5" transform="rotate(-28 26 36)" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="28.5" cy="27" r="1.5" fill="#ffffff" fill-opacity="0.9"/>
</svg>
